<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#050816;font-family:Inter,sans-serif;color:#d1d5db;position:relative;
 background-image:linear-gradient(rgba(79,143,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(79,143,255,.06) 1px,transparent 1px);background-size:60px 60px}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;right:-200px;top:-150px;background:radial-gradient(circle,rgba(79,143,255,.22),transparent 65%)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 72px;gap:56px}
.text{flex:1}
.badge{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;border:1px solid rgba(79,143,255,.35);background:rgba(79,143,255,.08);color:#4f8fff;font-size:22px;font-weight:500;margin-bottom:28px}
.dot{width:12px;height:12px;border-radius:50%;background:#4ade80}
h1{font-family:'Space Grotesk';font-size:88px;line-height:1;font-weight:700;color:#fff;letter-spacing:-2px}
h1 span{display:block;background:linear-gradient(135deg,#4f8fff,#f5a623);-webkit-background-clip:text;color:transparent}
.role{white-space:nowrap;font-family:'Space Grotesk';font-size:29px;font-weight:500;color:#fff;margin-top:24px}
.tags{font-family:'JetBrains Mono';font-size:21px;color:#7db0ff;margin-top:18px}
.url{position:absolute;left:72px;bottom:40px;font-family:'JetBrains Mono';font-size:22px;color:#f5a623}
.photo{width:340px;height:340px;border-radius:28px;overflow:hidden;border:2px solid rgba(79,143,255,.35);box-shadow:0 0 60px rgba(79,143,255,.25);flex-shrink:0}
.photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.8);transform-origin:41% 42%}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
 <div class="text">
  <div class="badge"><span class="dot"></span>Available for freelance &amp; contract work</div>
  <h1>BHAVESH<span>CHAUHAN</span></h1>
  <div class="role">Senior Software Engineer · Backend &amp; Cloud</div>
  <div class="tags">Node.js · NestJS · AWS · PostgreSQL · AI</div>
 </div>
 <div class="photo"><img src="../src/assets/images/your-photo.jpg"></div>
</div>
<div class="url">bhaveshchauhan.me</div>
</body></html>
